name: Ripubblica la pagina

# Parte quando cambia l'aspetto o il funzionamento della pagina (non i dati).
# Rigenera anteprima.html dall'archivio che c'e' gia' e la ripubblica: un minuto,
# nessuna lettura di siti, nessun gettone speso, e non riscrive niente nel repository
# (quindi non puo' richiamare se stesso).
# 8 ott 2026: due pubblicazioni di fila fallite con «Deployment failed, try again later» e
# nessun motivo, con GitHub che si diceva in salute. Si riprova piu' tardi con un push.
on:
  push:
    paths:
      - pagina/**
      - anteprima.py
      - profili.py
      - preferiti.json
      - .github/workflows/ripubblica-pagina.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Gruppo suo: se lo mettevo insieme ai giri, bastava che lui premesse un tasto
  # sulla pagina perche' GitHub cancellasse la ripubblicazione ancora in coda
  # (in un gruppo puo' aspettare un lavoro solo: l'ultimo arrivato scalza l'altro).
  group: ripubblica-pagina
  cancel-in-progress: true

jobs:
  ripubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Il ramo, non il commit: un giro programmato si porta dietro la versione del
          # momento in cui GitHub l'ha messo in coda, e partendo ore dopo sovrascriveva
          # l'archivio salvato nel frattempo da un altro giro (29 set 2026: persi i 204
          # bandi guardati da Jev e i 60 letti da Groq in un giro chiesto dalla pagina).
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rigenera la pagina dai dati gia' in archivio
        env:
          PYTHONIOENCODING: utf-8
        run: python anteprima.py
      - name: Pubblica
        run: |
          mkdir -p sito
          cp anteprima.html sito/index.html
          # Le pagine condivise con una sola persona (un profilo, solo lettura), se ce ne sono.
          [ -d condivisi ] && cp -r condivisi sito/condivisi || true
          [ -d calendari ] && cp -r calendari sito/calendari || true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sito
      - uses: actions/deploy-pages@v5
        id: pubblica
        # 8 ott 2026: quattro pubblicazioni di fila fallite per un intoppo di GitHub
        # («Fetching artifact metadata failed», «Deployment temporarily failed»): il
        # pacchetto della pagina c'era, ma il servizio non lo ritrovava subito. Se il primo
        # tentativo fallisce si aspetta un minuto e si riprova; se fallisce anche il secondo,
        # il lavoro risulta fallito come prima.
        continue-on-error: true
      - name: Se la pubblicazione e' fallita, aspetta un minuto
        if: ${{ !cancelled() && steps.pubblica.outcome == 'failure' }}
        run: sleep 60
      - uses: actions/deploy-pages@v5
        if: ${{ !cancelled() && steps.pubblica.outcome == 'failure' }}
        id: pubblica_di_nuovo
