name: Impostazioni cambiate dalla pagina

# Parte quando modifichi profili, siti o archivio dalla pagina online.
# Non rifà la raccolta: ricalcola solo la compatibilità e ripubblica, così
# il risultato si vede in un paio di minuti invece che al giorno dopo.
on:
  push:
    paths:
      - configurazione.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: giro-bandi
  cancel-in-progress: false

jobs:
  ricalcola:
    # I giri automatici riscrivono anch'essi il file: senza questo filtro
    # si richiamerebbero a vicenda all'infinito.
    if: "!startsWith(github.event.head_commit.message, 'Giro del') && !startsWith(github.event.head_commit.message, 'Comandi da Telegram del')"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa l'unica libreria che serve
        run: pip install pypdf

      - name: Applica le impostazioni e ricalcola
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.MONITOR_TELEGRAM_TOKEN }}
          MONITOR_TELEGRAM_CHAT: ${{ secrets.MONITOR_TELEGRAM_CHAT }}
          MONITOR_GROQ_CHIAVE: ${{ secrets.MONITOR_GROQ_CHIAVE }}
          PYTHONIOENCODING: utf-8
        run: |
          python configurazione.py --importa
          python configurazione.py --se-richiesto   # «Cerca adesso» premuto sulla pagina
          python siti.py            # controlla subito le fonti appena aggiunte
          python intelligenza.py --solo-giudizi
          python anteprima.py

      - name: Risalva l'archivio
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.MONITOR_TELEGRAM_TOKEN }}
          MONITOR_TELEGRAM_CHAT: ${{ secrets.MONITOR_TELEGRAM_CHAT }}
        run: bash salva.sh "Giro del $(date +%d/%m/%Y) - dopo modifica impostazioni"

      # Anche quando il salvataggio dell'archivio non riesce, la pagina si aggiorna
      # lo stesso: i dati nuovi sono gia' dentro anteprima.html, e restare a guardare
      # una pagina vecchia senza sapere perche' e' la cosa peggiore.
      - name: Pubblica la pagina
        if: ${{ !cancelled() }}
        run: |
          mkdir -p sito
          cp anteprima.html sito/index.html
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() }}
        with:
          path: sito
      - uses: actions/deploy-pages@v5
        if: ${{ !cancelled() }}
        id: pubblica
