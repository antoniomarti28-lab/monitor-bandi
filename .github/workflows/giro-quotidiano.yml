name: Giro quotidiano dei bandi

on:
  schedule:
    # Ogni mattina alle 7:00 italiane. GitHub ragiona in orario UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:        # cosi' si puo' anche far partire a mano dal sito

permissions:
  contents: write           # serve per risalvare l'archivio aggiornato
  pages: write
  id-token: write

concurrency:
  group: giro-bandi         # mai due giri sovrapposti sullo stesso archivio
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    environment:
      name: github-pages       # richiesto da deploy-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa l'unica libreria che serve
        run: pip install pypdf

      - name: Raccogli, leggi e avvisa
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.MONITOR_TELEGRAM_TOKEN }}
          MONITOR_TELEGRAM_CHAT: ${{ secrets.MONITOR_TELEGRAM_CHAT }}
          MONITOR_GROQ_CHIAVE: ${{ secrets.MONITOR_GROQ_CHIAVE }}
          PYTHONIOENCODING: utf-8
        run: python raccogli.py

      - name: Cerca fonti nuove (solo il lunedi)
        env:
          MONITOR_GROQ_CHIAVE: ${{ secrets.MONITOR_GROQ_CHIAVE }}
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.MONITOR_TELEGRAM_TOKEN }}
          MONITOR_TELEGRAM_CHAT: ${{ secrets.MONITOR_TELEGRAM_CHAT }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$(date +%u)" = "1" ]; then python scopri.py; else echo "non e' lunedi: salto"; fi

      - name: Rigenera la pagina da guardare
        run: python anteprima.py

      - name: Risalva l'archivio aggiornato
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.MONITOR_TELEGRAM_TOKEN }}
          MONITOR_TELEGRAM_CHAT: ${{ secrets.MONITOR_TELEGRAM_CHAT }}
        run: bash salva.sh "Giro del $(date +%d/%m/%Y)"

      # Anche quando il salvataggio dell'archivio non riesce, la pagina si aggiorna
      # lo stesso: i dati nuovi sono gia' dentro anteprima.html, e restare a guardare
      # una pagina vecchia senza sapere perche' e' la cosa peggiore.
      - name: Pubblica la pagina
        if: ${{ !cancelled() }}
        run: |
          mkdir -p sito
          cp anteprima.html sito/index.html
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() }}
        with:
          path: sito
      - uses: actions/deploy-pages@v5
        if: ${{ !cancelled() }}
        id: pubblica
