name: Giro quotidiano dei bandi

on:
  schedule:
    # Ogni mattina alle 7:00 italiane. GitHub ragiona in orario UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:        # cosi' si puo' anche far partire a mano dal sito

permissions:
  contents: write           # serve per risalvare l'archivio aggiornato
  pages: write
  id-token: write

concurrency:
  group: giro-bandi         # mai due giri sovrapposti sullo stesso archivio
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa l'unica libreria che serve
        run: pip install pypdf

      - name: Raccogli, leggi e avvisa
        env:
          MONITOR_TELEGRAM_TOKEN: ${{ secrets.MONITOR_TELEGRAM_TOKEN }}
          MONITOR_TELEGRAM_CHAT: ${{ secrets.MONITOR_TELEGRAM_CHAT }}
          MONITOR_GROQ_CHIAVE: ${{ secrets.MONITOR_GROQ_CHIAVE }}
          PYTHONIOENCODING: utf-8
        run: python raccogli.py

      - name: Rigenera la pagina da guardare
        run: python anteprima.py

      - name: Risalva l'archivio aggiornato
        run: |
          git config user.name "Monitor Bandi"
          git config user.email "noreply@github.com"
          git add dati.db anteprima.html
          git diff --staged --quiet || git commit -m "Giro del $(date +%d/%m/%Y)"
          git push

      - name: Pubblica la pagina
        run: |
          mkdir -p sito
          cp anteprima.html sito/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - uses: actions/deploy-pages@v4
